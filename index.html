<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Світло Вінниця</title>
<style>
:root{--bg:#0b1220;--panel:#151f30;--panel2:#1d2a3e;--text:#f3f6fb;--muted:#9aa9bd;--line:#2b3a50;--on:#20b978;--off:#f4b400;--accent:#8b8cf6}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#101a2b,#0b1220 45%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
.app{max-width:560px;margin:auto;padding:18px 14px 36px}.top{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin:0 2px 8px}.brand{font-size:22px;font-weight:800;letter-spacing:-.5px}.brand span{color:#a5a6ff}.sub{color:var(--muted);font-size:12px;margin-top:2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:15px;margin:12px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.head h2{font-size:17px;margin:0}.pill{border-radius:999px;padding:5px 9px;font-size:12px;background:#30304f;color:#c8c8ff;white-space:nowrap}.muted{color:var(--muted);font-size:13px}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#101a2a;padding:4px;border-radius:14px;margin:14px 0}.weather-card{padding:13px 15px}.weather-main{display:flex;align-items:center;gap:13px}.weather-icon{font-size:38px;line-height:1}.weather-temp{font-size:30px;font-weight:850;letter-spacing:-1px}.weather-desc{font-size:13px;color:var(--muted);margin-top:1px}.weather-details{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.weather-detail{background:var(--panel2);border-radius:10px;padding:7px 9px;font-size:12px;color:#dce5f2}.weather-foot{font-size:10px;color:var(--muted);margin-top:9px}.weather-foot a{color:#a5a6ff}.tab{border:0;background:transparent;color:var(--muted);padding:12px;border-radius:11px;font-weight:800;font-size:15px}.tab.active{background:var(--panel2);color:var(--text)}
.queues{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px}.queue-chip{flex:0 0 auto;min-width:100px;max-width:150px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);padding:9px 12px;text-align:left}.queue-chip.active{border-color:var(--accent);background:#242744}.queue-chip b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.queue-chip small{display:block;color:var(--muted);font-size:11px;margin-top:2px}.queue-actions{display:flex;gap:8px;margin:0 0 12px}.period{border-radius:14px;padding:13px 14px;background:#342b16;border:1px solid #5d4b1b;margin:9px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.period strong{font-size:21px;letter-spacing:.2px;color:#ffd45a}.period span{font-size:12px;color:#e8d9ae}.empty{color:var(--muted);text-align:center;padding:24px 8px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.hour{border-radius:11px;min-height:67px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:750;color:#111827;overflow:hidden;position:relative}.hour .time{font-size:14px;z-index:1}.hour small{font-size:10px;font-weight:650;z-index:1;margin-top:3px}.hour.off{background:var(--off)}.hour.on{background:var(--on);color:#062b1d}.hour.unknown{background:#526176;color:#fff}.hour.half-a{background:linear-gradient(90deg,var(--on) 0 50%,var(--off) 50% 100%);color:#10251c}.hour.half-b{background:linear-gradient(90deg,var(--off) 0 50%,var(--on) 50% 100%);color:#10251c}.legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:13px}.dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}.primary{border:0;background:#7779ef;color:white;border-radius:12px;padding:11px 13px;font-weight:750}.secondary{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:10px 12px;font-weight:650}.iconbtn{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:12px;padding:9px 11px;font-size:17px}.statusline{font-size:12px;color:var(--muted);margin-top:7px;line-height:1.45}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;padding:12px;z-index:5}.modal.hidden{display:none}.sheet{width:min(560px,100%);background:#152135;border:1px solid var(--line);border-radius:22px 22px 16px 16px;padding:18px;max-height:90vh;overflow:auto}.sheet h2{margin:0 0 14px}.field{width:100%;border:1px solid var(--line);background:#0f1928;color:var(--text);padding:12px;border-radius:11px;font:inherit;margin:6px 0 13px}.sheet label{font-size:13px;color:#c0ccdc}.row{display:flex;gap:8px}.row>*{flex:1}
</style>
</head>
<body><main class="app">
<header class="top"><button class="iconbtn" id="refresh" title="Оновити графік і погоду">↻</button></header>
<div class="queues" id="queues"></div>
<div class="queue-actions"><button class="primary" id="addQueue">＋ Додати чергу</button><button class="secondary" id="editQueue">Змінити</button><button class="secondary" id="deleteQueue">Видалити</button></div>
<nav class="tabs"><button class="tab active" data-day="today">СЬОГОДНІ</button><button class="tab" data-day="tomorrow">ЗАВТРА</button></nav>
<section class="card weather-card"><div class="head"><h2>Погода у Вінниці</h2><span class="muted" id="weatherDate">Завантажуємо…</span></div><div id="weatherContent"><div class="muted">Завантажуємо прогноз погоди…</div></div></section>
<section class="card"><div class="head"><h2 id="dateTitle">Відключення</h2><div style="display:flex;gap:6px;align-items:center"><span class="muted" id="gridDateTop"></span><button class="secondary" id="togglePeriods" type="button">Показати: є світло</button></div></div><div id="periods"><div class="empty">Завантажуємо графік…</div></div></section>
<section class="card"><div class="head"><h2>Графік на 24 години</h2><span class="muted" id="gridDate"></span></div><div class="grid" id="hours"></div><div class="legend"><span><i class="dot" style="background:var(--off)"></i>Немає світла</span><span><i class="dot" style="background:var(--on)"></i>Є світло</span><span><i class="dot" style="background:#526176"></i>Немає даних</span></div></section>
</main>
<div class="modal hidden" id="modal"><div class="sheet"><h2 id="modalTitle">Додати чергу</h2><label for="profileName">Назва (наприклад, Дім, Батьки, Робота)</label><input class="field" id="profileName" maxlength="30" placeholder="Дом"><label for="profileQueue">Номер черги</label><select class="field" id="profileQueue"></select><div class="row"><button class="primary" id="saveProfile">Зберегти</button><button class="secondary" id="cancelProfile">Скасувати</button></div></div></div>
<script>
const DATA_URL='https://raw.githubusercontent.com/vn-progr/gpv-voe-vinnytsia/main/data/Vinnytsiaoblenerho.json';
const WEATHER_URL='https://api.open-meteo.com/v1/forecast?latitude=49.2331&longitude=28.4682&daily=weather_code,temperature_2m_max,temperature_2m_min,apparent_temperature_max,apparent_temperature_min,precipitation_probability_max,precipitation_sum,wind_speed_10m_max&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=Europe%2FKyiv&forecast_days=2';
const WEATHER_CACHE_KEY='sv_vinnytsia_weather_v1';
const CACHE_KEY='sv_vinnytsia_auto_cache_v2', PROFILE_KEY='sv_vinnytsia_profiles_v2', TZ='Europe/Kyiv';
let dayMode='today',payload=null,loading=false,networkState='Очікування завантаження',profiles=[],activeProfile=0,editingIndex=-1,showPower=false,weatherPayload=null,weatherLoading=false;
const $=id=>document.getElementById(id);
const queueOptions=[];for(let g=1;g<=6;g++)for(let n=1;n<=2;n++)queueOptions.push(`${g}.${n}`);
function loadProfiles(){try{profiles=JSON.parse(localStorage.getItem(PROFILE_KEY)||'null')||[]}catch(e){profiles=[]}if(profiles.length===1&&profiles[0]?.name==='Дом'&&profiles[0]?.queue==='5.2'){profiles=[];saveProfiles()}activeProfile=profiles.length?Math.min(activeProfile,profiles.length-1):0}
function saveProfiles(){localStorage.setItem(PROFILE_KEY,JSON.stringify(profiles))}
function currentProfile(){return profiles[activeProfile]||null}
function kyivDate(d=new Date()){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(d)}
function dateFromEpoch(sec){return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(sec*1000))}
function niceDate(s){if(!s)return '';let [y,m,d]=s.split('-');return `${d}.${m}.${y}`}
function niceStamp(sec){if(!sec)return 'невідомо';return new Intl.DateTimeFormat('ru-RU',{timeZone:TZ,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}).format(new Date(sec*1000))}
function getDayEntry(mode){if(!payload?.fact?.data)return null;let target=new Date();if(mode==='tomorrow')target.setDate(target.getDate()+1);let wanted=kyivDate(target),keys=Object.keys(payload.fact.data),key=keys.find(k=>dateFromEpoch(Number(k))===wanted);return key?{date:wanted,record:payload.fact.data[key]}:null}
function weatherInfo(code){const map={0:['☀️','Ясно'],1:['🌤️','Переважно ясно'],2:['⛅','Мінлива хмарність'],3:['☁️','Хмарно'],45:['🌫️','Туман'],48:['🌫️','Паморозний туман'],51:['🌦️','Легка мряка'],53:['🌦️','Мряка'],55:['🌧️','Сильна мряка'],56:['🌧️','Крижана мряка'],57:['🌧️','Крижана мряка'],61:['🌧️','Невеликий дощ'],63:['🌧️','Дощ'],65:['🌧️','Сильний дощ'],66:['🌧️','Крижаний дощ'],67:['🌧️','Сильний крижаний дощ'],71:['🌨️','Невеликий сніг'],73:['🌨️','Сніг'],75:['❄️','Сильний сніг'],77:['🌨️','Снігові зерна'],80:['🌦️','Короткочасний дощ'],81:['🌧️','Зливи'],82:['⛈️','Сильні зливи'],85:['🌨️','Снігові заряди'],86:['❄️','Сильні снігові заряди'],95:['⛈️','Гроза'],96:['⛈️','Гроза з градом'],99:['⛈️','Сильна гроза з градом']};return map[code]||['🌡️','Змінна погода']}
function weatherTargetDate(){let d=new Date();if(dayMode==='tomorrow')d.setDate(d.getDate()+1);return kyivDate(d)}
function renderWeather(){const daily=weatherPayload?.daily;if(!daily?.time){$('weatherDate').textContent='';$('weatherContent').innerHTML='<div class="muted">Прогноз тимчасово недоступний.</div>';return}const target=weatherTargetDate(),i=daily.time.indexOf(target);if(i<0){$('weatherDate').textContent='';$('weatherContent').innerHTML='<div class="muted">Немає даних для цієї дати.</div>';return}const [icon,desc]=weatherInfo(daily.weather_code[i]),num=(v,suffix='')=>v==null?'—':`${Math.round(v)}${suffix}`,prob=daily.precipitation_probability_max?.[i],rain=daily.precipitation_sum?.[i],wind=daily.wind_speed_10m_max?.[i],feelsMin=daily.apparent_temperature_min?.[i],feelsMax=daily.apparent_temperature_max?.[i];$('weatherDate').textContent=niceDate(target);$('weatherContent').innerHTML=`<div class="weather-main"><div class="weather-icon">${icon}</div><div><div class="weather-temp">${num(daily.temperature_2m_min?.[i],'°')} / ${num(daily.temperature_2m_max?.[i],'°')}</div><div class="weather-desc">${desc} · мін. / макс.</div></div></div><div class="weather-details"><span class="weather-detail">🌡️ Відчувається: ${num(feelsMin,'°')}…${num(feelsMax,'°')}</span><span class="weather-detail">🌧️ Опади: ${prob==null?'—':Math.round(prob)+'%'} · ${rain==null?'—':rain.toFixed(1)+' мм'}</span><span class="weather-detail">💨 Вітер до ${num(wind,' км/год')}</span></div><div class="weather-foot">Прогноз: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></div>`}
async function loadWeather(force=false){if(weatherLoading)return;weatherLoading=true;try{const r=await fetch(WEATHER_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j?.daily?.time)throw new Error('Невідомий формат прогнозу');weatherPayload=j;localStorage.setItem(WEATHER_CACHE_KEY,JSON.stringify(j))}catch(e){if(!weatherPayload){try{weatherPayload=JSON.parse(localStorage.getItem(WEATHER_CACHE_KEY)||'null')}catch(_){}}}finally{weatherLoading=false;renderWeather()}}
function halfSlots(value){if(value==='yes')return ['on','on'];if(value==='no')return ['off','off'];if(value==='first')return ['on','off'];if(value==='second')return ['off','on'];return ['unknown','unknown']}
function getSlots(entry){if(!entry||!currentProfile())return Array(48).fill('unknown');let q=entry.record['GPV'+currentProfile().queue];if(!q)return Array(48).fill('unknown');let out=[];for(let h=1;h<=24;h++)out.push(...halfSlots(q[String(h)]));return out}
function rangesFromSlots(slots,wanted){let out=[],start=null;for(let i=0;i<=slots.length;i++){let match=i<slots.length&&slots[i]===wanted;if(match&&start===null)start=i;if(!match&&start!==null){out.push([start,i]);start=null}}return out.map(([a,b])=>`${fmt(a)}–${fmt(b)}`)}
function fmt(i){let mins=i*30,h=Math.floor(mins/60),m=mins%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`}
function renderProfiles(){let root=$('queues');root.innerHTML='';profiles.forEach((p,i)=>{let b=document.createElement('button');b.className='queue-chip'+(i===activeProfile?' active':'');b.innerHTML=`<b>${escapeHtml(p.name)}</b><small>Черга ${escapeHtml(p.queue)}</small>`;b.onclick=()=>{activeProfile=i;renderProfiles();render()};root.append(b)});$('editQueue').disabled=!profiles.length;$('deleteQueue').disabled=profiles.length<=1}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let p=currentProfile(),entry=getDayEntry(dayMode),slots=getSlots(entry),date=entry?.date,wanted=showPower?'on':'off';$('dateTitle').textContent=showPower?'Періоди зі світлом':'Періоди відключень';$('togglePeriods').textContent=showPower?'Показати: відключення':'Показати: є світло';$('gridDateTop').textContent=date?niceDate(date):'';$('gridDate').textContent=date?niceDate(date):'—';$('periods').innerHTML='';if(!p){$('periods').innerHTML='<div class="empty">Додайте свою чергу, щоб побачити графік.</div>'}else if(!entry||!entry.record['GPV'+p.queue]){$('periods').innerHTML='<div class="empty">Графік на цю дату ще не опубліковано.</div>'}else{let rs=rangesFromSlots(slots,wanted);if(!rs.length)$('periods').innerHTML=`<div class="empty">${showPower?'В опублікованих даних немає періодів зі світлом.':'За опублікованим графіком відключень немає.'}</div>`;else rs.forEach(r=>{let d=document.createElement('div');d.className='period'+(showPower?' power':'');if(showPower){d.style.background='#123a2b';d.style.borderColor='#206b4b';}d.innerHTML=`<strong>${r}</strong><span>${showPower?'Є електроенергія':'Немає електроенергії'}</span>`;if(showPower){d.style.background='#123a2b';d.style.borderColor='#206b4b';d.querySelector('strong')?.style.setProperty('color','#8ff0bd');d.querySelector('span')?.style.setProperty('color','#c4f4dc')} $('periods').append(d)})}$('hours').innerHTML='';for(let h=0;h<24;h++){let a=slots[h*2],b=slots[h*2+1],state=a===b?a:(a==='on'&&b==='off'?'half-a':a==='off'&&b==='on'?'half-b':'unknown'),label=state==='off'?'Немає світла':state==='on'?'Є світло':state==='half-a'?'З 30-ї хв.':state==='half-b'?'Перші 30 хв.':'Немає даних',el=document.createElement('div');el.className='hour '+state;el.innerHTML=`<span class="time">${String(h).padStart(2,'0')}:00</span><small>${label}</small>`;$('hours').append(el)}}
async function load(force=false){if(loading)return;loading=true;try{let url=DATA_URL+(force?'?t='+Date.now():'');let r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);let j=await r.json();if(!j?.fact?.data)throw new Error('Невідомий формат даних');payload=j;localStorage.setItem(CACHE_KEY,JSON.stringify(j));networkState='Дані оновлено'}catch(e){if(!payload){try{payload=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){}}networkState=payload?'Немає зв’язку · показано збережений графік':'Не вдалося завантажити дані'}finally{loading=false;render()}}
function openProfile(index=-1){editingIndex=index;let p=index<0?{name:'',queue:''}:profiles[index];$('modalTitle').textContent=index<0?'Додати чергу':'Змінити чергу';$('profileName').value=p.name;$('profileQueue').innerHTML='<option value="">Оберіть чергу</option>'+queueOptions.map(q=>`<option value="${q}">${q}</option>`).join('');$('profileQueue').value=p.queue;$('modal').classList.remove('hidden')}
$('addQueue').onclick=()=>openProfile();$('editQueue').onclick=()=>openProfile(activeProfile);$('cancelProfile').onclick=()=>$('modal').classList.add('hidden');$('saveProfile').onclick=()=>{let name=$('profileName').value.trim(),queue=$('profileQueue').value;if(!name){alert('Вкажіть назву черги');return}if(!queue){alert('Оберіть номер черги');return}if(editingIndex<0){if(profiles.length>=12){alert('Можна додати до 12 черг');return}profiles.push({name,queue});activeProfile=profiles.length-1}else profiles[editingIndex]={name,queue};saveProfiles();$('modal').classList.add('hidden');renderProfiles();render()};$('deleteQueue').onclick=()=>{if(profiles.length<=1)return;if(confirm(`Видалити чергу «${currentProfile().name}»?`)){profiles.splice(activeProfile,1);activeProfile=Math.max(0,activeProfile-1);saveProfiles();renderProfiles();render()}};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{dayMode=b.dataset.day;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render();renderWeather()});$('refresh').onclick=()=>{load(true);loadWeather(true)};$('togglePeriods').onclick=()=>{showPower=!showPower;render()};
loadProfiles();renderProfiles();try{payload=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(e){}render();renderWeather();load();loadWeather();setInterval(()=>load(),5*60*1000);setInterval(()=>loadWeather(true),30*60*1000);
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script></body></html>
